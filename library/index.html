<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | Ivan Vasilev</title>
    <!-- Unlisted page: not linked from the site, kept out of search engines -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/jpeg" href="../images/profile.jpg">
    <link rel="stylesheet" href="../css/style.css?v=20261116-1">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <style>
        .library-page {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        .library-search {
            width: 100%;
            font: inherit;
            font-size: 0.95rem;
            padding: 10px 14px;
            border: 2px solid var(--primary-color);
            margin-bottom: 8px;
        }
        .library-status {
            color: var(--gray);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }
        .library-section {
            padding: 0;
            min-height: 0;
        }
        .library-section > p a {
            color: var(--primary-color);
            font-weight: 700;
        }
        .library-section > p a:hover {
            color: var(--gray);
        }
        .library-section > h1 {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 36px 0 4px;
        }
        .library-section h2 {
            font-size: 1rem;
            font-weight: 700;
            margin: 28px 0 10px;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--primary-color);
        }
        .library-entry {
            padding: 28px 0 24px;
            border-bottom: 1px solid var(--light-gray);
        }
        .library-entry h3 {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 18px;
        }
        .library-entry .entry-sources {
            margin-top: 22px;
            padding-top: 10px;
            border-top: 1px solid var(--light-gray);
            font-size: 0.85rem;
            color: var(--gray);
        }
        .library-entry .entry-sources a {
            color: #555;
        }
        .library-entry h3 a.entry-anchor {
            color: var(--light-gray);
            text-decoration: none;
            margin-left: 6px;
            font-weight: 400;
        }
        .library-entry h3 a.entry-anchor:hover {
            color: var(--gray);
        }
        .library-entry p,
        .library-entry ul,
        .library-entry ol,
        .library-entry blockquote {
            margin: 6px 0;
        }
        .library-entry ul,
        .library-entry ol {
            padding-left: 22px;
        }
        .library-entry a {
            color: var(--primary-color);
        }
        .library-entry a:hover {
            color: var(--gray);
        }
        .library-entry blockquote {
            border-left: 3px solid var(--light-gray);
            padding-left: 12px;
            color: #555;
        }
        .library-entry table {
            border-collapse: collapse;
            margin: 12px 0;
            width: 100%;
        }
        .library-entry th,
        .library-entry td {
            padding: 6px 10px;
            vertical-align: top;
            text-align: left;
            border-bottom: 1px solid var(--light-gray);
        }
        .library-entry th {
            border-bottom: 2px solid var(--primary-color);
        }
        .library-entry td:nth-child(2),
        .library-entry th:nth-child(2) {
            text-align: center;
            width: 40px;
        }
        .library-entry code {
            font-size: 0.9em;
            background: #f4f4f4;
            padding: 1px 4px;
        }
        .library-entry .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px 0;
        }
        .library-breadcrumb {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--gray);
            margin: -40px 0 24px;
            text-align: center;
        }
        .library-breadcrumb a {
            color: var(--primary-color);
        }
        .library-breadcrumb a:hover {
            color: var(--gray);
        }
        .library-list {
            list-style: none;
            margin-top: 8px;
        }
        .library-list li {
            padding: 8px 0;
            border-bottom: 1px solid var(--light-gray);
            font-size: 1.05rem;
        }
        .library-list li a {
            color: var(--primary-color);
            font-weight: 700;
        }
        .library-list li a:hover {
            color: var(--gray);
        }
        .library-list .fine-print {
            display: inline;
            margin: 0;
        }
        #library-results .library-section > h1 {
            display: none;
        }
        .library-area-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 12px 0 12px;
        }
        .library-intro h1 {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 12px 0;
        }
        .library-intro p,
        .library-intro ul,
        .library-intro ol {
            margin: 8px 0;
        }
        .library-intro ul,
        .library-intro ol {
            padding-left: 22px;
        }
        .library-intro a {
            color: var(--primary-color);
        }
        .library-subheading {
            font-size: 1rem;
            font-weight: 700;
            margin: 28px 0 4px;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--primary-color);
        }
        .library-source {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin: 24px 0 0;
        }
        .library-source a {
            color: var(--primary-color);
        }
        .library-status:empty {
            display: none;
        }
        .library-empty {
            color: var(--gray);
            font-size: 0.9rem;
            margin-top: 8px;
        }
        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
<main class="library-page">
    <h1 class="section-title">Library</h1>

    <nav class="library-breadcrumb" aria-label="Breadcrumb"></nav>

    <input class="library-search" type="search" placeholder="Search entries, tags, formulas…" aria-label="Search the library">
    <p class="library-status" aria-live="polite"></p>

    <div id="library-view"></div>
    <div id="library-results" hidden></div>
</main>

<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/marked/marked.umd.js"></script>
<script src="vendor/marked/marked-katex-extension.umd.js"></script>
<script src="library.js?v=20261117-5"></script>
</body>
</html>
